<!DOCTYPE html>
<html>
<head>
<title>Para Dulce ❤️</title>

<style>
body{
    margin:0;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:linear-gradient(135deg,#ff4e8a,#ff9ac2);
    font-family:Arial, sans-serif;
}

/* Texto principal */
h1{
    font-size:40px;
    color:white;
    text-align:center;
    animation:latido 1.5s infinite;
    z-index:5;
}

@keyframes latido{
    0%{transform:scale(1);}
    50%{transform:scale(1.08);}
    100%{transform:scale(1);}
}

/* Flores cayendo */
.flor{
    position:absolute;
    top:-50px;
    font-size:25px;
    animation:caer linear infinite;
}

@keyframes caer{
    0%{transform:translateY(0);}
    100%{transform:translateY(110vh);}
}

/* Corazones flotando */
.corazon{
    position:absolute;
    bottom:-50px;
    font-size:20px;
    animation:subir 10s linear infinite;
}

@keyframes subir{
    0%{transform:translateY(0);}
    100%{transform:translateY(-110vh);}
}

/* Corazón grande hecho con rosas */
.rosa-corazon{
    position:absolute;
    font-size:18px;
    color:white;
    z-index:1;
}
</style>
</head>

<body>

<h1>TE AMO MUCHO MI MOCHI HERMOSA ❤️</h1>

<!-- Música automática -->
<audio id="musica" autoplay loop muted>
    <source src="cancion.mp3" type="audio/mpeg">
</audio>

<script>
const audio = document.getElementById("musica");
setTimeout(()=>{
    audio.muted = false;
    audio.volume = 0.5;
},1000);
</script>

<!-- Generar flores cayendo -->
<script>
for(let i=0;i<20;i++){
    let flor = document.createElement("div");
    flor.className="flor";
    flor.innerHTML="🌸";
    flor.style.left=Math.random()*100+"%";
    flor.style.animationDuration=(5+Math.random()*5)+"s";
    flor.style.fontSize=(20+Math.random()*20)+"px";
    document.body.appendChild(flor);
}
</script>

<!-- Corazones flotando -->
<script>
for(let i=0;i<8;i++){
    let corazon=document.createElement("div");
    corazon.className="corazon";
    corazon.innerHTML="❤️";
    corazon.style.left=Math.random()*100+"%";
    corazon.style.animationDuration=(8+Math.random()*5)+"s";
    document.body.appendChild(corazon);
}
</script>

<!-- Corazón grande con rosas -->
<script>
const heartShape = [
"   🌹🌹   🌹🌹   ",
" 🌹🌹🌹🌹 🌹🌹🌹🌹 ",
"🌹🌹🌹🌹🌹🌹🌹🌹🌹",
" 🌹🌹🌹🌹🌹🌹🌹🌹 ",
"  🌹🌹🌹🌹🌹🌹🌹  ",
"   🌹🌹🌹🌹🌹🌹   ",
"    🌹🌹🌹🌹🌹    ",
"     🌹🌹🌹🌹     ",
"      🌹🌹🌹      ",
"       🌹🌹       ",
"        🌹        "
];

let container = document.createElement("div");
container.style.position="absolute";
container.style.top="60%";
container.style.left="50%";
container.style.transform="translate(-50%,-50%)";
container.style.whiteSpace="pre";
container.style.fontSize="15px";
container.style.opacity="0.7";
container.style.zIndex="1";

container.innerHTML=heartShape.join("\n");
document.body.appendChild(container);
</script>

</body>
</html>
