<!DOCTYPE html>
<html>
<head>
<title>Para Mi Mochi ❤️</title>

<style>
body{
    margin:0;
    height:100vh;
    background:linear-gradient(to top,#f8e1e7,#ffffff);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    font-family:Arial, sans-serif;
    overflow:hidden;
}

/* Texto */
h1{
    margin-top:20px;
    font-size:40px;
    color:#d81b60;
    animation:latido 1.5s infinite;
}

@keyframes latido{
    0%{transform:scale(1);}
    50%{transform:scale(1.08);}
    100%{transform:scale(1);}
}

/* Árbol */
.tree{
    position:relative;
    width:300px;
    height:350px;
}

/* Tronco */
.trunk{
    position:absolute;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:30px;
    height:120px;
    background:#8B4513;
    border-radius:10px;
}

/* Corazones */
.heart{
    position:absolute;
    color:red;
    font-size:20px;
    animation:flotar 4s ease-in-out infinite;
}

@keyframes flotar{
    0%{transform:translateY(0);}
    50%{transform:translateY(-10px);}
    100%{transform:translateY(0);}
}

/* Botón */
button{
    margin-top:20px;
    padding:12px 30px;
    font-size:18px;
    border:none;
    border-radius:25px;
    background:#ff4e8a;
    color:white;
    cursor:pointer;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
    transition:0.3s;
}

button:hover{
    background:#e91e63;
    transform:scale(1.05);
}
</style>
</head>

<body>

<div class="tree">
    <div class="trunk"></div>
</div>

<h1>TE AMO MOCHI ❤️</h1>

<button onclick="document.getElementById('musica').play()">
▶ Reproducir Nuestra Canción
</button>

<audio id="musica" loop>
    <source src="cancion.mp3" type="audio/mpeg">
</audio>

<script>
const tree = document.querySelector(".tree");

/* Crear copa de corazones */
for(let i=0;i<120;i++){
    let heart = document.createElement("div");
    heart.className="heart";
    heart.innerHTML="❤️";

    let x = Math.random()*200 + 50;
    let y = Math.random()*180;

    heart.style.left = x + "px";
    heart.style.top = y + "px";
    heart.style.animationDuration = (2+Math.random()*3)+"s";

    tree.appendChild(heart);
}
</script>

</body>
</html>
