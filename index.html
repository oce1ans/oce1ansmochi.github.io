<!DOCTYPE html>
<html>
<head>
<title>Para Mi Mochi ❤️</title>

<style>
body{
    margin:0;
    height:100vh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    font-family:Arial, sans-serif;
    background:linear-gradient(to top,#ff9a9e,#fad0c4,#fbc2eb);
    animation:sky 10s infinite alternate;
}

/* Cielo animado */
@keyframes sky{
    from{filter:brightness(1);}
    to{filter:brightness(1.1);}
}

/* Texto principal */
h1{
    margin-top:20px;
    font-size:38px;
    color:#c2185b;
    animation:latido 1.5s infinite;
}

@keyframes latido{
    0%{transform:scale(1);}
    50%{transform:scale(1.1);}
    100%{transform:scale(1);}
}

/* Mensaje secreto */
#mensaje{
    opacity:0;
    margin-top:10px;
    font-size:22px;
    color:#880e4f;
    transition:2s;
}

/* Árbol */
.tree{
    position:relative;
    width:350px;
    height:400px;
}

.trunk{
    position:absolute;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:40px;
    height:150px;
    background:#6d4c41;
    border-radius:20px;
}

.crown{
    position:absolute;
    bottom:120px;
    left:50%;
    transform:translateX(-50%);
    width:280px;
    height:220px;
}

/* Corazones */
.heart{
    position:absolute;
    font-size:22px;
    animation:flotar 3s ease-in-out infinite;
}

@keyframes flotar{
    0%{transform:translateY(0);}
    50%{transform:translateY(-8px);}
    100%{transform:translateY(0);}
}

/* Hojas cayendo */
.falling{
    position:absolute;
    top:-50px;
    font-size:18px;
    animation:fall linear infinite;
}

@keyframes fall{
    to{ transform:translateY(110vh); }
}

/* Flores */
.flower{
    position:absolute;
    bottom:0;
    font-size:25px;
    animation:grow 3s ease-in-out infinite alternate;
}

@keyframes grow{
    from{ transform:scale(0.8); }
    to{ transform:scale(1.2); }
}

/* Brillitos */
.sparkle{
    position:absolute;
    font-size:14px;
    animation:blink 2s infinite alternate;
}

@keyframes blink{
    from{opacity:0.3;}
    to{opacity:1;}
}

/* Botón */
button{
    margin-top:15px;
    padding:12px 30px;
    font-size:16px;
    border:none;
    border-radius:25px;
    background:#ff4e8a;
    color:white;
    cursor:pointer;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
    transition:0.3s;
}

button:hover{
    background:#e91e63;
    transform:scale(1.05);
}
</style>
</head>

<body>

<div class="tree">
    <div class="trunk"></div>
    <div class="crown" id="crown"></div>
</div>

<h1>TE AMO MOCHI ❤️</h1>
<div id="mensaje">Eres mi mundo mi negra hermosa 💌</div>

<button onclick="document.getElementById('musica').play()">
▶ Tócame :3
</button>

<audio id="musica" loop>
    <source src="cancion.mp3" type="audio/mpeg">
</audio>

<script>
const crown = document.getElementById("crown");

/* Copa redonda */
for(let i=0;i<140;i++){
    let heart=document.createElement("div");
    heart.className="heart";
    heart.innerHTML="❤️";

    let angle=Math.random()*2*Math.PI;
    let radius=100*Math.sqrt(Math.random());
    let x=140 + radius*Math.cos(angle);
    let y=100 + radius*Math.sin(angle);

    heart.style.left=x+"px";
    heart.style.top=y+"px";
    heart.style.animationDuration=(2+Math.random()*2)+"s";

    crown.appendChild(heart);
}

/* Hojas cayendo */
for(let i=0;i<15;i++){
    let fall=document.createElement("div");
    fall.className="falling";
    fall.innerHTML="🍃";
    fall.style.left=Math.random()*100+"%";
    fall.style.animationDuration=(4+Math.random()*4)+"s";
    document.body.appendChild(fall);
}

/* Flores */
for(let i=0;i<12;i++){
    let flower=document.createElement("div");
    flower.className="flower";
    flower.innerHTML="🌸";
    flower.style.left=Math.random()*100+"%";
    flower.style.animationDelay=(Math.random()*3)+"s";
    document.body.appendChild(flower);
}

/* Brillitos */
for(let i=0;i<20;i++){
    let sparkle=document.createElement("div");
    sparkle.className="sparkle";
    sparkle.innerHTML="✨";
    sparkle.style.left=Math.random()*100+"%";
    sparkle.style.top=Math.random()*100+"%";
    document.body.appendChild(sparkle);
}

/* Mostrar mensaje después de 5 segundos */
setTimeout(()=>{
    document.getElementById("mensaje").style.opacity="1";
},5000);
</script>

</body>
</html>
